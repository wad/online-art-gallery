services:
  oag-db:
    image: postgres:16-alpine
    container_name: oag-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OAG_DB_NAME:-oag}
      POSTGRES_USER: ${OAG_DB_USERNAME:-oag}
      POSTGRES_PASSWORD: ${OAG_DB_PASSWORD:-oag}
    volumes:
      - oag-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OAG_DB_USERNAME:-oag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  oag-app:
    image: eclipse-temurin:21-jre-alpine
    container_name: oag-app
    restart: unless-stopped
    depends_on:
      oag-db:
        condition: service_healthy
    command: ["java", "-Xmx512m", "-jar", "/app/oag.jar"]
    volumes:
      - ./backend/target/oag.jar:/app/oag.jar:ro
    ports:
      - "8080:8080"
    environment:
      OAG_DB_HOST: oag-db
      OAG_DB_PORT: 5432
      OAG_DB_NAME: ${OAG_DB_NAME:-oag}
      OAG_DB_USERNAME: ${OAG_DB_USERNAME:-oag}
      OAG_DB_PASSWORD: ${OAG_DB_PASSWORD:-oag}
      OAG_JWT_SECRET: ${OAG_JWT_SECRET}
      OAG_SITE_DOMAIN: ${OAG_SITE_DOMAIN:-http://localhost:8080}
      OAG_ADSENSE_PUBLISHER_ID: ${OAG_ADSENSE_PUBLISHER_ID:-}

volumes:
  oag-db-data:
