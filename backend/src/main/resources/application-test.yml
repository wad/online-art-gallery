spring:
  datasource:
    url: jdbc:h2:mem:oag_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

oag:
  site-domain: http://localhost:8080
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha256
    expiration-hours: 24
